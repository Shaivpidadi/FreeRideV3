name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a newer commit lands.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Cover the supported Python range declared in pyproject.toml
        # (>=3.10). 3.10 is the floor; current is 3.13.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        # The pyproject.toml `addopts = -m 'not e2e'` already excludes
        # e2e tests from the default selection, so this just runs the
        # hermetic suite. e2e tests need real provider keys and aren't
        # safe to burn on every push.
        run: pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff>=0.6

      - name: Run ruff
        run: ruff check freeride/ tests/

  unit-windows:
    name: pytest (windows, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

  e2e:
    # Only runs when at least one provider key is present in repo secrets.
    # Forks won't have access — this lane is opt-in for the maintainer.
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'Shaivpidadi/FreeRideV3'
    strategy:
      fail-fast: false
      matrix:
        shard: [providers, agents]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev + e2e extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e]"

      - name: Run e2e tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FREERIDE_E2E: "1"
        # Each shard hits a disjoint slice. providers/ is the per-provider
        # matrix (5 providers × 4 tests); agents/ is the agent integration
        # tests (Aider/Continue/Hermes/OpenClaw/openai-python).
        run: |
          if [ "${{ matrix.shard }}" = "providers" ]; then
            pytest -m e2e tests/e2e/test_providers.py -v
          else
            pytest -m e2e --ignore=tests/e2e/test_providers.py tests/e2e/ -v
          fi
